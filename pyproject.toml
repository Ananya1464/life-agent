[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "life_agent"
version = "1.0.0"
description = "A Personal AI Agent & Behavioral Feedback System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests",
]

[tool.setuptools.packages.find]
where = ["src"]
