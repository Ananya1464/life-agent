[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "life_agent"
version = "1.0.0"
description = "A Personal AI Agent & Behavioral Feedback System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "mcp>=2.0",  # server imports mcp.server.mcpserver (2.x layout)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
